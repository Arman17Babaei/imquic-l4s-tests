# Paths resolve relative to the repository root. Python 3.11+.
version = 1
output = "results/player-experiments"

[defaults]
scenes = ["bicycle", "drjohnson", "playroom", "room", "stump", "train", "treehill", "truck"]
delays_ms = [0, 1, 5, 10, 50, 100, 500] # Total ONE-WAY propagation, not RTT.
duration_seconds = 20 # Original ~60-second NTHU duration; normalize small recording-end differences.
path = "ideal" # "ideal": deterministic offline IMQUIC; "qemu": scene + BBR TCP + Prague TCP.
controllers = ["prague", "reno", "reno-ect0"] # ECT(1), Not-ECT, ECT(0); QEMU only; fixed backgrounds.
dualpi2_coupling_factor = 2
reruns = 5 # Total repetitions per scene/delay/controller, including the first; applies only to QEMU.
on_failure = "continue" # Log failures and continue; exactly one attempt per item.
max_retries = 0
retry_exhausted = "continue" # "continue" or "stop".
failure_criterion = "quality" # "capture", "quality", or "all"; see docs.

[capture]
width = 960
height = 540
fps = 5
quality_fps = 5
quality_backend = "cuda"
gpu_mode = "hardware"
headless = true
start_after_first_object = true # QEMU only: first applied object; ideal starts empty at its initial request.
max_missing_snapshot_fraction = 0.05 # QEMU tolerance; ideal requires every frame.

[runner]
timeout_seconds = 900
attempt_timeout_seconds = 3000
memory_limit_mib = 7168 # systemd user scope; 0 disables this limit.
min_available_memory_gib = 4
min_free_disk_gib = 5
python = ".venvs/3dgs/bin/python" # Existing CUDA/PyTorch environment.

[qemu]
reuse_vm = true # One VM per batch; fresh processes and topology per case.
base = "~/sandbox/p4/work.qcow2"
runner = "tools/l4s/run_qemu_player.py"
cpus = 7
memory_mib = 2048
performance_mode = false # Optional: Seven pinned vCPUs, host performance power profile, guest priorities/offloads and 250 us Prague pacing.

[analysis]
enabled = true
vmaf = true
vmaf_backend = "cuda"
plots = true
vmaf_binary = ".toolchains/vmaf-cuda-src/libvmaf/build/tools/vmaf"
vmaf_model = ".toolchains/vmaf-cuda-src/model/vmaf_v0.6.1.json"

# Train and Dr Johnson use the second saved trace; other scenes retain the first.
# Selection seed: 12411750058326799050. Normalized traces retain native timing;
# duration_seconds above controls playback retiming. Raw traces remain unchanged.
[scenes.bicycle]
manifest = "data/scenes/bicycle-30000/manifest-v2.json"
# Raw selection: data/datasets/nthu/selected-5-per-scene/traces/bicycle/user4_bicycle.json
trace = "data/traces/nthu-selected/user4_bicycle.json"

[scenes.drjohnson]
manifest = "data/scenes/drjohnson/manifest-v2.json"
# Raw selection: data/datasets/nthu/selected-5-per-scene/traces/drjohnson/user2_drjohnson.json
trace = "data/traces/nthu-selected-150mbps/user2_drjohnson.json"

[scenes.playroom]
