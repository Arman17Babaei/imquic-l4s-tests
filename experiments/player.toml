[[experiments]]
name = "selected-traces-ideal-10mbps-60s"
path = "ideal"
bandwidth_mbps = 10

[[experiments]]
name = "selected-traces-ideal-50mbps-60s"
path = "ideal"
bandwidth_mbps = 50

[[experiments]]
name = "selected-traces-ideal-100mbps-60s"
path = "ideal"
bandwidth_mbps = 100

# Every QEMU case has one unlimited BBR TCP and one unlimited Prague TCP
# background stream sharing the scene bottleneck.
# QEMU: 30 ms base RTT = 15 ms total one-way = 5 ms per link per direction.
# Scene Prague/Reno/Reno-ECT(0) selection does not change these two background streams.
[[experiments]]
name = "selected-traces-qemu-10mbps-20s-rtt30ms"
path = "qemu"
bandwidth_mbps = 10
delays_ms = [15]

[[experiments]]
name = "selected-traces-qemu-50mbps-20s-rtt30ms"
path = "qemu"
bandwidth_mbps = 50
delays_ms = [15]

[[experiments]]
name = "selected-traces-qemu-100mbps-20s-rtt30ms"
path = "qemu"
bandwidth_mbps = 100
delays_ms = [15]

# One diagnostic BBR sample; do not expand this into a replicated BBR suite.
[[experiments]]
name = "bicycle-qemu-bbr-50mbps-20s-rtt30ms"
path = "qemu"
bandwidth_mbps = 50
scenes = ["bicycle"]
controllers = ["bbr"] # BBR, ECT(0); same BBR + Prague backgrounds.
delays_ms = [15]
reruns = 1
